<ion-content>
  <div class="backbutton">
    <ion-icon (click)="Volver()" class="backbutton" name="arrow-back-circle"></ion-icon>
  </div>
  <div class="header">
    <h1>Crear Cuenta</h1>
    <h3>Estas a un paso de tener tu cuenta!</h3>
  </div>
  <div class="form">
    <form [formGroup]="formReg" (ngSubmit)="onSubmit()" class="Iniciarsesion">
      <div>
          <ion-input type="text" class="form-control" placeholder="Email" formControlName="email"></ion-input>
      </div>
      <div>
          <ion-input type="password" class="form-control" placeholder="Contraseña" formControlName="password"></ion-input>
      </div>
    </form>
  </div>
  <div class="button" (click)="onSubmit()">
    <h3 class="boton">Crear Cuenta</h3>
  </div>
  <div class="footer">
    <h3>Crea tu cuenta en <br> <span>KALLONA</span></h3>
  </div>
</ion-content>
